<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LabBrain | Autonomous Web Agent + Code Console</title>
    <style>
        :root {
            --bg-base: #050505;
            --bg-panel: #0d0d0d;
            --bg-element: #1a1a1a;
            --accent: #00baff;
            --accent-dim: rgba(0, 186, 255, 0.15);
            --text-main: #e0e0e0;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --glow: 0 0 12px rgba(0, 186, 255, 0.4);
            --font-mono: 'Courier New', Courier, monospace;
            --think: #ffb84d;
            --think-dim: rgba(255, 184, 77, 0.12);
            --action-color: #bb86fc;
            --like-color: #28a745;
            --dislike-color: #dc3545;
            --code-text: #00ffaa;
            --memory-color: #00d2ff;
            --danger: #ff3b5c;
            --app-height: 100vh;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body { height: 100%; overscroll-behavior: none; }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(ellipse 900px 500px at 15% -10%, rgba(0, 186, 255, 0.08), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 110%, rgba(187, 134, 252, 0.06), transparent 60%),
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: auto, auto, 34px 34px, 34px 34px;
            color: var(--text-main);
            font-family: var(--font-mono);
            height: var(--app-height, 100vh);
            display: flex;
            overflow: hidden;
            position: relative;
        }

        /* Fundo tipo "matrix rain" sutil, atrás de tudo */
        #matrix-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0;
            opacity: 0.16;
            pointer-events: none;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.5;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        #sidebar {
            width: 82%;
            max-width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0; bottom: 0; left: 0;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        #sidebar.closed { transform: translateX(-100%); }

        #sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.65);
            z-index: 90;
            backdrop-filter: blur(3px);
            opacity: 0;
            transition: opacity 0.3s;
        }
        #sidebar:not(.closed) + #sidebar-overlay {
            display: block;
            opacity: 1;
        }

        .sidebar-header { padding: 18px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; }

        #new-chat-btn { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); padding: 6px 12px; cursor: pointer; transition: all 0.2s; font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 1px; }
        #new-chat-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }
        #new-chat-btn:active { transform: scale(0.96); }

        #chat-list { flex: 1; overflow-y: auto; list-style: none; }
        .chat-item { padding: 14px 18px; border-bottom: 1px solid #131313; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; position: relative; }
        .chat-item:hover { background: var(--bg-element); }
        .chat-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); padding-left: 15px; }
        .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.85rem; flex: 1; color: #ccc; }
        .delete-chat { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; margin-left: 10px; padding: 5px; line-height: 1; }
        .delete-chat:hover { color: var(--danger); }

        #main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; overflow: hidden; z-index: 1; }

        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--accent);
            padding: calc(10px + env(safe-area-inset-top, 0px)) 15px 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(0, 186, 255, 0.08);
            z-index: 5;
            flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        #toggle-sidebar { background: none; border: none; color: var(--accent); font-size: 1.3rem; cursor: pointer; padding: 4px 8px 4px 0; flex-shrink: 0; }
        .logo { font-size: 1.05rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; text-shadow: var(--glow); min-width: 0; }
        .logo span { color: var(--text-main); text-shadow: none; }
        .logo img {
            transition: filter 0.2s, transform 0.2s;
            flex-shrink: 0;
        }
        .logo:hover img {
            filter: drop-shadow(0 0 8px var(--accent));
            transform: scale(1.04);
        }
        .live-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--like-color);
            box-shadow: 0 0 6px var(--like-color);
            display: inline-block;
            animation: pulse-dot 1.6s ease-in-out infinite;
            flex-shrink: 0;
        }
        @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        #chat-container { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; scroll-behavior: smooth; width: 100%; -webkit-overflow-scrolling: touch; }

        .message { max-width: 100%; width: 100%; padding: 14px; line-height: 1.6; position: relative; animation: fadeIn 0.25s ease; white-space: pre-wrap; word-break: break-word; font-size: 0.88rem; margin-bottom: 8px; border-radius: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; background: #111; border-right: 3px solid var(--text-muted); color: #ddd; }
        .message.bot { align-self: flex-start; background: var(--bg-panel); border-left: 3px solid var(--accent); box-shadow: -6px 0 18px rgba(0, 186, 255, 0.06); }

        .chat-img-thumb { max-width: 100%; max-height: 200px; border: 1px solid var(--accent); margin: 8px 0; display: block; border-radius: 3px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
        .chat-img-thumb:hover { box-shadow: var(--glow); }

        .code-container { background: #09090b; border: 1px solid var(--border-color); border-radius: 6px; margin: 14px 0; overflow: hidden; width: 100%; box-shadow: 0 4px 16px rgba(0, 0, 0, 0.55); }
        .code-toolbar { background: #141417; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 0.72rem; color: #888; font-family: var(--font-mono); text-transform: uppercase; }
        .code-lang { color: var(--accent); font-weight: bold; }
        .copy-code-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main); padding: 4px 10px; cursor: pointer; font-size: 0.68rem; border-radius: 4px; transition: all 0.2s; }
        .copy-code-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); box-shadow: var(--glow); }
        .code-container pre { padding: 14px; margin: 0; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .code-container code { font-family: var(--font-mono); color: var(--code-text); font-size: 0.82rem; white-space: pre; }

        .memory-badge { background: rgba(0, 210, 255, 0.08); border: 1px solid var(--memory-color); border-left: 4px solid var(--memory-color); padding: 10px 14px; margin: 12px 0; border-radius: 4px; color: var(--memory-color); font-size: 0.78rem; display: flex; align-items: flex-start; gap: 8px; }

        .bot-label, .user-label { position: absolute; top: -10px; font-size: 0.62rem; padding: 0 5px; text-transform: uppercase; letter-spacing: 1px; }
        .bot-label { left: 10px; background: var(--bg-base); color: var(--accent); border: 1px solid var(--accent); }
        .user-label { right: 10px; background: var(--bg-base); color: var(--text-muted); border: 1px solid var(--border-color); }

        .thoughts-details { margin-top: 14px; border: 1px dashed var(--action-color); background: rgba(187, 134, 252, 0.05); font-size: 0.75rem; border-radius: 3px; }
        .thoughts-details summary { cursor: pointer; padding: 11px 10px; color: var(--action-color); text-transform: uppercase; list-style: none; display: flex; align-items: center; gap: 6px; letter-spacing: 0.5px; }
        .thoughts-details summary::-webkit-details-marker { display: none; }
        .thoughts-details summary::before { content: "▶"; font-size: 0.6rem; transition: transform 0.2s; }
        .thoughts-details[open] summary::before { transform: rotate(90deg); }
        .thoughts-content { padding: 8px 12px 12px 12px; border-top: 1px dashed var(--action-color); display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; }
        .thought-line { color: #d8b98a; font-size: 0.76rem; line-height: 1.4; white-space: pre-wrap; }
        .action-line { color: var(--action-color); font-weight: bold; }

        #thoughts-stream-wrap { display: none; border: 1px dashed var(--think); background: #0a0704; margin: 0 12px; max-height: 160px; overflow-y: auto; font-size: 0.75rem; flex-direction: column; flex-shrink: 0; border-radius: 3px 3px 0 0; }
        #thoughts-stream-wrap.visible { display: flex; }
        #thoughts-stream-header { padding: 6px 10px; color: var(--think); text-transform: uppercase; font-size: 0.63rem; letter-spacing: 1px; border-bottom: 1px dashed var(--think); position: sticky; top: 0; background: #0a0704; z-index: 2; display: flex; align-items: center; gap: 6px; }
        #thoughts-stream { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }

        #image-preview-bar { display: none; align-items: center; gap: 10px; background: #111; border: 1px solid var(--accent); padding: 6px 12px; margin: 0 12px 5px 12px; font-size: 0.75rem; border-radius: 3px; flex-shrink: 0; }
        #image-preview-bar.visible { display: flex; }
        #image-preview-bar img { height: 38px; width: 38px; object-fit: cover; border: 1px solid var(--border-color); border-radius: 2px; }

        #input-panel {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)) 12px;
            display: flex; flex-direction: column; gap: 8px;
            z-index: 5;
            flex-shrink: 0;
        }
        .toolbar-options { display: flex; flex-direction: column; gap: 8px; }

        .toolbar-left {
            display: flex; align-items: center; gap: 8px;
            flex-wrap: nowrap; overflow-x: auto;
            padding-bottom: 4px; -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .toolbar-left::-webkit-scrollbar { display: none; }

        #agent-toggle, #thoughts-toggle, #image-attach-btn, #clear-memory-btn { background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-muted); padding: 7px 12px; font-family: var(--font-mono); font-size: 0.72rem; cursor: pointer; text-transform: uppercase; transition: all 0.2s; white-space: nowrap; flex-shrink: 0; letter-spacing: 0.5px; border-radius: 2px; }
        #agent-toggle.active { border-color: var(--action-color); color: var(--action-color); background: rgba(187, 134, 252, 0.1); box-shadow: 0 0 8px rgba(187, 134, 252, 0.25); }
        #thoughts-toggle.active { border-color: var(--think); color: var(--think); background: var(--think-dim); }
        #clear-memory-btn:hover { border-color: var(--danger); color: var(--danger); }

        .input-row { display: flex; gap: 10px; align-items: flex-end; }

        #prompt-input { flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; resize: none; height: 46px; max-height: 120px; font-family: var(--font-mono); font-size: 0.9rem; border-radius: 2px; }
        #prompt-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(0, 186, 255, 0.15); }
        #prompt-input::placeholder { color: #4a4a4a; }

        #send-btn { background: var(--bg-base); border: 1px solid var(--accent); color: var(--accent); height: 46px; padding: 0 16px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.15s; display: flex; align-items: center; justify-content: center; font-size: 0.82rem; border-radius: 2px; letter-spacing: 0.5px; flex-shrink: 0; }
        #send-btn:hover { background: var(--accent); color: #000; box-shadow: var(--glow); }
        #send-btn:active { transform: scale(0.96); }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .loading { align-self: flex-start; color: var(--action-color); font-size: 0.82rem; display: none; padding: 10px 14px; border: 1px dashed var(--action-color); background: rgba(187, 134, 252, 0.05); width: 100%; text-align: left; border-radius: 3px; }
        .loading .dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } 100% { content: ''; } }

        a.source-link { color: #4da6ff; text-decoration: none; border-bottom: 1px dotted #4da6ff; word-break: break-all; }
        a.source-link:hover { color: var(--accent); }

        @media (min-width: 768px) {
            #chat-container { padding: 30px; gap: 20px; }
            #sidebar { position: relative; width: 280px; }
            #sidebar.closed { margin-left: -280px; transform: none; }
            #sidebar-overlay, #sidebar:not(.closed) + #sidebar-overlay { display: none; }
            .message { max-width: 85%; padding: 15px 20px; font-size: 0.95rem; }
            #thoughts-stream-wrap { margin: 0 30px; max-height: 220px; }
            #image-preview-bar { margin: 0 20px 5px 20px; }
            #input-panel { padding: 15px 20px; }
            .toolbar-options { flex-direction: row; justify-content: space-between; align-items: center; }
            .toolbar-left { flex-wrap: wrap; overflow-x: visible; }
            .logo { font-size: 1.2rem; letter-spacing: 2px; }
        }

        @media (max-width: 767px) {
            /* garante que a área de digitação nunca fique inacessível atrás do teclado/UI do navegador */
            #input-panel { position: sticky; bottom: 0; }
        }
    </style>
</head>

            const codeBlocks = [];
            formatted = formatted.replace(/```([a-zA-Z0-9_\-\+]*)\s*\n?([\s\S]*?)```/g, (m, lang, code) => {
                const id = `__CODE_BLOCK_${codeBlocks.length}__`;
                const escapedCode = code.trim().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                codeBlocks.push(`<div class="code-container"><div class="code-toolbar"><span class="code-lang">💻 ${lang?lang.toUpperCase():'CÓDIGO'}</span><button class="copy-code-btn" onclick="copyToClipboard(this)">COPIAR</button></div><pre><code>${escapedCode}</code></pre></div>`);
                return id;
            });

            formatted = formatted.replace(/!\[([^\]]*)\]\((https?:\/\/[^\s]+)\)/g, '<a href="$2" target="_blank"><img class="chat-img-thumb" src="$2" alt="$1" title="$1"></a>');
            formatted = formatted.replace(/^### (.*$)/gim, '<h3 style="margin: 12px 0 6px 0; color: var(--action-color); font-size: 1rem; border-bottom: 1px dashed var(--border-color); padding-bottom: 3px;">$1</h3>');
            formatted = formatted.replace(/^## (.*$)/gim, '<h2 style="margin: 14px 0 8px 0; color: #fff; font-size: 1.1rem; text-transform: uppercase;">$1</h2>');
            formatted = formatted.replace(/^# (.*$)/gim, '<h1 style="margin: 16px 0 10px 0; color: var(--accent); font-size: 1.25rem;">$1</h1>');
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong style="color: #fff; font-weight: bold;">$1</strong>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<em style="color: #ccc;">$1</em>');
            formatted = formatted.replace(/^\s*[\*\-] (.*$)/gim, '<div style="margin-left: 15px; display: flex; gap: 6px;"><span style="color: var(--action-color);">▪</span><span>$1</span></div>');
            formatted = formatted.replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, '<a class="source-link" href="$2" target="_blank" rel="noopener">$1</a>');

            codeBlocks.forEach((block, index) => { formatted = formatted.replace(`__CODE_BLOCK_${index}__`, block); });

                        }

                    else if (type === 'play_sound') {
                        let ctx = new (window.AudioContext || window.webkitAudioContext)();
                        let osc = ctx.createOscillator();
                        let gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);

                        if (param === 'success') {
                            osc.frequency.setValueAtTime(440, ctx.currentTime);
                            osc.frequency.setValueAtTime(660, ctx.currentTime + 0.1);
                            osc.type = 'sine';
                            osc.start();
                            osc.stop(ctx.currentTime + 0.2);
                        } else {
                            osc.frequency.setValueAtTime(300, ctx.currentTime);
                            osc.type = 'square';
                            osc.start();
                            osc.stop(ctx.currentTime + 0.15);
                        }
                        resolve(`Som (${param}) reproduzido fisicamente no dispositivo do usuário.`);
                    }
                    else if (type === 'download_file') {

                        let content = param.content || "Vazio.";
                        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });

            });

        async function fetchViaProxies(targetUrl) {
            const proxies = [
                u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
                u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
                u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
            ];
            for (const build of proxies) {

                    if (!resp.ok) continue;
                    const html = await resp.text();
                    if (html && html.length > 200) return { html };

            return null;
        }

        async function searchQuery(query) {
            const cacheKey = `search:${query}`;
            if (sessionCache.has(cacheKey)) return sessionCache.get(cacheKey);

            const engines = [
                `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`,
                `https://www.bing.com/search?q=${encodeURIComponent(query)}`
            ];

            for (const searchUrl of engines) {
                const result = await fetchViaProxies(searchUrl);
                if (!result) continue;
                const doc = new DOMParser().parseFromString(result.html, 'text/html');

                let results = [];
                if (searchUrl.includes('duckduckgo')) {
                    const snippets = doc.querySelectorAll('.result__snippet');
                    const links = doc.querySelectorAll('.result__url');
                    const anchorLinks = doc.querySelectorAll('.result__title a');
                    snippets.forEach((el, index) => {
                        let targetUrl = anchorLinks[index] ? anchorLinks[index].getAttribute('href') : '';
                        if (targetUrl && targetUrl.includes('uddg=')) {
                            const m = targetUrl.match(/uddg=([^&]+)/);
                            if (m) targetUrl = decodeURIComponent(m[1]);
                        }
                        results.push({ snippet: el.textContent.trim(), link: links[index]?.textContent.trim(), targetUrl });
                    });
                } else {
                    // fallback Bing
                    const items = doc.querySelectorAll('li.b_algo');
                    items.forEach(li => {
                        const a = li.querySelector('h2 a');
                        const snippet = li.querySelector('.b_caption p, p');
                        if (a) {
                            results.push({
                                snippet: snippet ? snippet.textContent.trim() : '',
                                link: a.href,
                                targetUrl: a.href
                            });
                        }
                    });
                }

                if (results.length > 0) {
                    const out = { results };
                    sessionCache.set(cacheKey, out);
                    return out;
                }
            }
            const empty = { results: [] };
            sessionCache.set(cacheKey, empty);
            return empty;
        }

        async function extractWebsiteContent(url) {
            if (!url || !url.startsWith('http')) return null;
            const cacheKey = `read:${url}`;
            if (sessionCache.has(cacheKey)) return sessionCache.get(cacheKey);

            const fetched = await fetchViaProxies(url);
            if (!fetched || !fetched.html) return null;

            const doc = new DOMParser().parseFromString(fetched.html, 'text/html');

            const title = doc.querySelector('title')?.textContent?.trim() || '';
            const metaDesc = doc.querySelector('meta[name="description"]')?.getAttribute('content')
                || doc.querySelector('meta[property="og:description"]')?.getAttribute('content') || '';

            const allLinks = Array.from(doc.querySelectorAll('a[href]'))
                .map(a => ({ text: a.textContent.trim().substring(0,50), href: a.getAttribute('href') }))
                .filter(l => l.text.length > 2 && l.href.startsWith('http'));

            doc.querySelectorAll('script, style, noscript, nav, header, footer, iframe, svg').forEach(el => el.remove());
            const text = Array.from(doc.querySelectorAll('p, article, h1, h2, h3, li, td'))
                .map(p => p.textContent.trim())
                .filter(txt => txt.length > 20)
                .join('\n').substring(0, 10000);

            const uniqueLinks = [];
            const seen = new Set();
            allLinks.forEach(l => { if(!seen.has(l.href)) { seen.add(l.href); uniqueLinks.push(l); }});

            const out = { title, metaDesc, pageText: text, links: uniqueLinks.slice(0, 20) };
            sessionCache.set(cacheKey, out);
            return out;
        }

        function sanitizeFinalResponse(content) {
            if (!content || typeof content !== 'string') return 'Recebi. Me diga o objetivo real para agir.';
            const normalized = content.trim();
            const weirdPatterns = [
                /sinal recebido/i,
                /aguardo o objetivo real para agir/i,
                /diga o que precisa/i,
                /recebido\.?\s*me diga/i
            ];
            if (weirdPatterns.some(pattern => pattern.test(normalized))) {
                return 'Recebi. Me diga o objetivo real para agir.';
            }
            return normalized;
        }

        async function callModel(messages, maxTokens, retries = 2) {
            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetchWithTimeout("https://openrouter.ai/api/v1/chat/completions", 40000).catch(() => null);
                    // fetchWithTimeout acima não passa opções, então fazemos a chamada real aqui:
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 45000);
                    const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        signal: controller.signal,
                        headers: {
                            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href,
                            "X-Title": "LabBrain"
                        },
                        body: JSON.stringify({
                            model: MODEL_ID,
                            messages: messages,
                            max_tokens: maxTokens || 2000
                        })
                    });
                    clearTimeout(timeoutId);

                    const raw = await res.text();
                    let data;
                    try {
                        data = JSON.parse(raw);
                    } catch {
                        throw new Error(`HTTP ${res.status}\nResposta não-JSON:\n${raw.substring(0, 1000)}`);
                    }

                    if (!res.ok) {
                        const error = data?.error || {};
                        throw new Error(`HTTP ${res.status}\ncódigo: ${error.code ?? "desconhecido"}\nmensagem: ${error.message ?? "sem mensagem"}`);
                    }

                    const content = data?.choices?.[0]?.message?.content;
                    if (!content) {
                        throw new Error(`API respondeu sem conteúdo:\n${JSON.stringify(data).substring(0, 2000)}`);
                    }

                    return content.trim();
                } catch (err) {
                    if (attempt === retries) throw err;
                    await new Promise(r => setTimeout(r, 800 * (attempt + 1)));
                }
            }
        }

            } else {
                let iterations = 0;
                let isFinished = false;
                const MAX_ITERATIONS = 12;

                while (iterations < MAX_ITERATIONS && !isFinished) {
                    iterations++;
                    pushThought(`🔄 Iniciando Iteração ${iterations}/${MAX_ITERATIONS}...`);

                    let response;
                    try {
                        response = await callModel(loopMessages, 1500);
                    } catch (e) {
                        finalBotContent = `[FALHA NA REDE] O agente encontrou um erro de conexão: ${e.message}`;
                        break;
                    }

                    let thoughtMatch = response.match(/<thought>([\s\S]*?)<\/thought>/i);
                    if (thoughtMatch) {
                        let t = thoughtMatch[1].trim();
                        pushThought(`🧠 ${t}`);
                        thoughtsForStorage.push(`[Iteração ${iterations}] Raciocínio: ${t}`);
                    }

                    let actionMatch = response.match(/<action>([\s\S]*?)<\/action>/i);
                    if (!actionMatch) {
                        pushThought("⚠️ Resposta sem ação válida. Ajustando para uma finalização natural e objetiva.");
                        finalBotContent = sanitizeFinalResponse(response);
                        isFinished = true;
                        break;
                    }

                    let actionJson;
                    try {
                        let cleanJson = actionMatch[1].replace(/```json/gi, '').replace(/```/g, '').trim();
                        actionJson = JSON.parse(cleanJson);
                    } catch (e) {
                        pushThought(`⚠️ Agente enviou JSON inválido. Solicitando correção...`);
                        loopMessages.push({ role: 'assistant', content: response });
                        loopMessages.push({ role: 'user', content: "Erro de parser. Seu JSON na tag <action> está malformado. Corrija e responda estritamente o formato esperado." });
                        continue;
                    }

                    let actionType = actionJson.type || actionJson.action;
                    let actionParam = actionJson.param || actionJson.parameters || "";

                    thoughtsForStorage.push(`[AÇÃO EXECUTADA] ${actionType}: ${JSON.stringify(actionParam)}`);
                    loopMessages.push({ role: 'assistant', content: response });

                    if (actionType === 'finish') {
                        finalBotContent = typeof actionParam === 'string' ? sanitizeFinalResponse(actionParam) : sanitizeFinalResponse(JSON.stringify(actionParam));
                        pushThought(`✅ Tarefa concluída pelo Agente!`);
                        isFinished = true;
                        break;
                    }

                    let actionResult = "";
                    pushThought(`⚙️ EXECUTANDO: ${actionType}...`, true);

                    try {
                        if (actionType === 'web_search') {
                            const { results } = await searchQuery(actionParam);
                            actionResult = results.slice(0, 5).map(r => `[URL: ${r.targetUrl || r.link}]\nTrecho: ${r.snippet}`).join('\n\n');
                            if (!actionResult) actionResult = "Sua busca não retornou resultados. Tente outros termos, mais curtos ou mais genéricos.";
                        }
                        else if (actionType === 'site_search') {
                            const query = `site:${actionParam.domain || actionParam.site} ${actionParam.query}`;
                            const { results } = await searchQuery(query);
                            actionResult = results.slice(0, 5).map(r => `[URL: ${r.targetUrl || r.link}]\nTrecho: ${r.snippet}`).join('\n\n');
                            if (!actionResult) actionResult = "Busca no site não retornou nada. Navegue até o site principal (read_url) ou mude os termos.";
                        }
                        else if (actionType === 'read_url' || actionType === 'click_link' || actionType === 'click') {
                            // 'click_link' / 'click' são tratados como navegação para o href informado,
                            // que é o mais próximo de "clicar num link" que dá pra fazer com segurança
                            // a partir do navegador (sites cross-origin não podem ser controlados via DOM real).
                            const targetUrl = typeof actionParam === 'string' ? actionParam : (actionParam.url || actionParam.href);
                            const scraped = await extractWebsiteContent(targetUrl);
                            if (scraped && scraped.pageText) {
                                actionResult = `[TÍTULO]: ${scraped.title}\n[DESCRIÇÃO]: ${scraped.metaDesc}\n\n[CONTEÚDO DA PÁGINA]:\n${scraped.pageText}\n\n[LINKS INTERNOS DISPONÍVEIS NESTA PÁGINA - use read_url ou click_link com um destes hrefs pra navegar]:\n${scraped.links.map(l=> `- ${l.text}: ${l.href}`).join('\n')}`;
                            } else {
                                actionResult = "Página não pôde ser lida (proxy indisponível, captcha, ou site bloqueando acesso automatizado).";
                            }
                        }
                        else if (['open_tab', 'play_sound', 'download_file'].includes(actionType)) {
                            actionResult = await executeSystemCommand(actionType, actionParam);
                        }
                        else {
                            actionResult = `Ação desconhecida ou não suportada: ${actionType}. Ações disponíveis: web_search, site_search, read_url (ou click_link), open_tab, play_sound, download_file, finish.`;
                        }
                    } catch (err) {
                        actionResult = `Ocorreu uma exceção ao executar ${actionType}: ${err.message}`;
                    }

                    pushThought(`📥 Sistema respondeu ao Agente com o resultado.`);
                    loopMessages.push({ role: 'user', content: `[RETORNO DO SISTEMA / RESULTADO DA FERRAMENTA]:\n${actionResult}\n\nO que você fará agora? Lembre-se do formato OBRIGATÓRIO de <thought> e <action>.` });
                }

                if (!finalBotContent) {
                    finalBotContent = "Atingi o limite máximo do Agente (Timeout). Infelizmente não consegui concluir tudo. Resumo até o momento:\n\n" + currentThoughtsLog.join('\n');
                }
            }

            const learnMatches = [...finalBotContent.matchAll(/<aprender>([\s\S]*?)<\/aprender>/gi)];
            if (learnMatches.length > 0) {
                const saved = localStorage.getItem('labbrain_learned_facts') || "[]";
                const facts = JSON.parse(saved);
                learnMatches.forEach(m => {
                    const f = m[1].trim();
                    if (f && !facts.includes(f)) { facts.push(f); pushThought(`💾 Memória Salva: ${f.substring(0, 30)}...`); }
                });
                localStorage.setItem('labbrain_learned_facts', JSON.stringify(facts));
            }

            clearInterval(timerInterval);
            loadingIndicator.style.display = 'none';
            sendBtn.disabled = false;
            thoughtsStreamWrap.classList.remove('visible');
            statusHint.innerText = "AGENTE: STANDBY";

            chat.messages.push({ role: 'bot', content: finalBotContent, thoughts: isAgentActive ? [...thoughtsForStorage] : null });
            appendMessageDOM('bot', finalBotContent, isAgentActive ? [...thoughtsForStorage] : null);
            saveChats();
        }

        function clearAttachedImage() {
            attachedImage = null;
            imagePreviewBar.classList.remove('visible');
            attachedImgPreview.src = '';
            fileInput.value = '';
        }

        function setupEventListeners() {
            if (toggleSidebarBtn) toggleSidebarBtn.onclick = () => sidebar.classList.toggle('closed');
            if (sidebarOverlay) sidebarOverlay.onclick = () => sidebar.classList.add('closed');

            if (newChatBtn) newChatBtn.onclick = createNewChat;
            if (sendBtn) sendBtn.onclick = sendMessage;

            clearMemoryBtn.onclick = () => {
                if (confirm(`Deseja apagar a memória de longo prazo adquirida pelo Agente?`)) {
                    localStorage.removeItem('labbrain_learned_facts');
                    alert("Memória apagada.");
                }
            };

            imageAttachBtn.onclick = () => {
                const url = prompt("Cole a URL da Imagem:");
                if (url && url.startsWith('http')) {
                    attachedImage = { url, isBase64: false };
                    attachedImgPreview.src = url;
                    attachedImgName.innerText = url;
                    imagePreviewBar.classList.add('visible');
                } else {
                    fileInput.click();
                }
            };

            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const r = new FileReader();
                    r.onload = (event) => {
                        attachedImage = { url: event.target.result, isBase64: true };
                        attachedImgPreview.src = event.target.result;
                        attachedImgName.innerText = file.name;
                        imagePreviewBar.classList.add('visible');
                    };
                    r.readAsDataURL(file);
                }
            };

            removeImgBtn.onclick = clearAttachedImage;

            agentToggle.onclick = () => {
                isAgentActive = !isAgentActive;
                agentToggle.classList.toggle('active', isAgentActive);
                agentToggle.innerText = isAgentActive ? "AUTONOMOUS AGENT: ON" : "AUTONOMOUS AGENT: OFF";
            };

            thoughtsToggle.onclick = () => {
                isThoughtsVisible = !isThoughtsVisible;
                thoughtsToggle.classList.toggle('active', isThoughtsVisible);
                thoughtsToggle.innerText = isThoughtsVisible ? "LOGS VÍSIVEIS" : "LOGS OCULTOS";
                if (!isThoughtsVisible) thoughtsStreamWrap.classList.remove('visible');
            };

            if (promptInput) {
                promptInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        }

        init();
    </script>
</body>
</html>
