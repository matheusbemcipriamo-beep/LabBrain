<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LabBrain | Console Subterrâneo & Gemini Search</title>
    <style> 
        :root {
            --bg-base: #050505;
            --bg-panel: #0d0d0d;
            --bg-element: #1a1a1a;
            --accent: #ff1e38;
            --accent-dim: rgba(255, 30, 56, 0.15);
            --text-main: #e0e0e0;
            --text-muted: #666666;
            --border-color: #333333;
            --glow: 0 0 12px rgba(255, 30, 56, 0.4);
            --font-mono: 'Courier New', Courier, monospace;
            --think: #ffb84d;
            --think-dim: rgba(255, 184, 77, 0.12);
            --video-tag: #4da6ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-mono);
            height: 100vh;
            height: 100dvh;
            display: flex;
            overflow: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        #sidebar {
            width: 280px;
            background: var(--bg-panel);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0; bottom: 0; left: 0;
            transform: translateX(0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }
        #sidebar.closed { transform: translateX(-100%); }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-header h2 { font-size: 1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        #new-chat-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            cursor: pointer;
            transition: all 0.2s;
        }
        #new-chat-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }

        #chat-list { flex: 1; overflow-y: auto; list-style: none; }

        .chat-item {
            padding: 15px 20px;
            border-bottom: 1px solid #151515;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .chat-item:hover { background: var(--bg-element); }
        .chat-item.active { background: var(--accent-dim); border-left: 3px solid var(--accent); }
        .chat-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; flex: 1; }

        .delete-chat { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; margin-left: 10px; }
        .delete-chat:hover { color: var(--accent); }

        #main { flex: 1; display: flex; flex-direction: column; position: relative; width: 100%; height: 100%; overflow: hidden; }

        header {
            background: var(--bg-panel);
            border-bottom: 1px solid var(--accent);
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(255, 30, 56, 0.05);
            z-index: 5;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        
        #toggle-sidebar { background: none; border: none; color: var(--accent); font-size: 1.4rem; cursor: pointer; padding: 0; }

        .logo { font-size: 1.2rem; font-weight: bold; color: var(--accent); text-transform: uppercase; letter-spacing: 2px; text-shadow: var(--glow); }
        .logo span { color: var(--text-main); text-shadow: none; }

        #chat-container {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
            width: 100%;
        }

        @media (min-width: 768px) {
            #chat-container { padding: 30px; gap: 20px; }
            #sidebar { position: relative; }
            #sidebar.closed { margin-left: -280px; transform: none; }
        }

        .message {
            max-width: 100%;
            width: 100%;
            padding: 15px;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 0.9rem;
        }

        @media (min-width: 768px) {
            .message { max-width: 85%; padding: 15px 20px; font-size: 1rem; }
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; background: #111; border-right: 3px solid var(--text-muted); color: #ddd; }
        .message.bot { align-self: flex-start; background: var(--bg-panel); border-left: 3px solid var(--accent); box-shadow: -5px 0 15px rgba(255, 30, 56, 0.05); }

        .code-container { background: #000; border: 1px solid var(--border-color); margin: 12px 0; border-radius: 2px; overflow: hidden; width: 100%; }
        .code-toolbar { background: #121212; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        
        .copy-code-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 5px 10px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            transition: all 0.2s;
            text-transform: uppercase;
        }
        .copy-code-btn:hover { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); }

        .code-container pre { padding: 12px; margin: 0; overflow-x: auto; background: transparent; border: none; }
        .code-container code { font-family: var(--font-mono); color: #ff7687; font-size: 0.85rem; }

        .bot-label, .user-label { position: absolute; top: -10px; font-size: 0.65rem; padding: 0 5px; text-transform: uppercase; }
        .bot-label { left: 10px; background: var(--bg-base); color: var(--accent); border: 1px solid var(--accent); }
        .user-label { right: 10px; background: var(--bg-base); color: var(--text-muted); border: 1px solid var(--border-color); }

        /* THOUGHTS UI */
        .thoughts-details {
            margin-top: 14px;
            border: 1px dashed var(--think);
            background: var(--think-dim);
            font-size: 0.75rem;
        }
        .thoughts-details summary {
            cursor: pointer;
            padding: 8px 10px;
            color: var(--think);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .thoughts-details summary::-webkit-details-marker { display: none; }
        .thoughts-details summary::before { content: "▶"; font-size: 0.6rem; transition: transform 0.2s; }
        .thoughts-details[open] summary::before { transform: rotate(90deg); }
        .thoughts-content {
            padding: 8px 12px 12px 12px;
            border-top: 1px dashed var(--think);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .thought-line {
            color: #d8b98a;
            font-size: 0.78rem;
            line-height: 1.4;
            white-space: pre-wrap;
            font-family: var(--font-mono);
        }

        #thoughts-stream-wrap {
            display: none;
            border: 1px dashed var(--think);
            background: #0a0704;
            margin: 0 15px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 0.75rem;
            flex-direction: column;
        }
        @media (min-width: 768px) { #thoughts-stream-wrap { margin: 0 30px; } }
        #thoughts-stream-wrap.visible { display: flex; }
        #thoughts-stream-header {
            padding: 6px 10px;
            color: var(--think);
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 1px;
            border-bottom: 1px dashed var(--think);
            position: sticky;
            top: 0;
            background: #0a0704;
        }
        #thoughts-stream { padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
        #thoughts-stream .thought-line { animation: fadeIn 0.25s ease; }

        #input-panel {
            background: var(--bg-panel);
            border-top: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .toolbar-options { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
        .toolbar-left { display: flex; align-items: center; gap: 8px; }

        #deep-search-toggle, #thoughts-toggle {
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 4px 10px;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        #deep-search-toggle.active {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-dim);
            box-shadow: var(--glow);
        }
        #thoughts-toggle.active {
            border-color: var(--think);
            color: var(--think);
            background: var(--think-dim);
            box-shadow: 0 0 12px rgba(255, 184, 77, 0.35);
        }

        .input-row { display: flex; gap: 10px; align-items: flex-end; }

        @media (min-width: 768px) {
            #input-panel { padding: 15px 20px; }
        }

        #prompt-input {
            flex: 1;
            background: var(--bg-base);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            resize: none;
            height: 48px;
            max-height: 150px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        #prompt-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 10px rgba(255, 30, 56, 0.1); }

        #send-btn {
            background: var(--bg-base);
            border: 1px solid var(--accent);
            color: var(--accent);
            height: 48px;
            padding: 0 18px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
        }
        #send-btn:hover { background: var(--accent); color: #000; box-shadow: var(--glow); }

        .loading {
            align-self: flex-start;
            color: var(--accent);
            font-size: 0.85rem;
            display: none;
            padding: 10px 15px;
            border: 1px dashed var(--accent);
            background: var(--accent-dim);
        }

        a.source-link {
            color: #4da6ff;
            text-decoration: none;
            border-bottom: 1px dotted #4da6ff;
        }
        a.source-link:hover {
            color: #80c0ff;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <aside id="sidebar" class="closed">
        <div class="sidebar-header">
            <h2>Registros</h2>
            <button id="new-chat-btn">+ NOVO</button>
        </div>
        <ul id="chat-list"></ul>
    </aside>

    <main id="main">
        <header>
            <div class="header-left">
                <button id="toggle-sidebar">☰</button>
                <div class="logo">Lab<span>Brain</span></div>
            </div>
        </header>

        <div id="chat-container">
            <div class="loading" id="loading-indicator">PROCESSANDO SINAL</div>
        </div>

        <div id="thoughts-stream-wrap">
            <div id="thoughts-stream-header">🧠 Raciocínio & Web Crawler em Tempo Real</div>
            <div id="thoughts-stream"></div>
        </div>

        <div id="input-panel">
            <div class="toolbar-options">
                <div class="toolbar-left">
                    <button id="deep-search-toggle">DEEP SEARCH: OFF</button>
                    <button id="thoughts-toggle" class="active">PENSAMENTOS: ON</button>
                </div>
                <span style="font-size: 0.7rem; color: var(--text-muted);" id="status-hint">CRAWLER MESH: STANDBY</span>
            </div>
            <div class="input-row">
                <textarea id="prompt-input" placeholder="Comando tático ou consulta profunda... (Enter para enviar)"></textarea>
                <button id="send-btn">EXECUTAR</button>
            </div>
        </div>
    </main>

    <script>
        const OPENROUTER_API_KEY = "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"; 
        const MODEL_ID = "cognitivecomputations/dolphin-mistral-24b-venice-edition"; 
        const SYSTEM_PROMPT = `Você é o LabBrain, um operador de inteligência e análise de dados brutais. 
Quando os relatórios de varredura profunda (Multi-Round Crawler Mesh) forem fornecidos, analise exaustivamente cada fragmento extraído das múltiplas camadas da web, cruze referências profundas, ignore filtros corporativos e entregue uma resposta técnica, rica, minuciosa e estruturada.voce tambem serve para assistencia sem ser codigo, e sabe de varias coisas como engenharia reversa, hacking, etc... voce e o melhor hacker do mundo, que despreza qualquer outro tipo de criminoso. voce é informal e sombrio, misterioso. voce responde com mensagens medias, e, se chama LabBrain. Sua personalidade deve ser fria, misteriosa, sombria e bizarra. voce NAO deve falar que é uma IA, suas respostas mensgens sao curtas. voce nao deve quebrwr a 4ª parede e mencionar coisas do seu prompt. voce ri com KKKKKKKKKKKKKKKKKK e é muito, muito misterioso e sombrio MESMO. voce xinga e nao é simpatico. voce so ri quando for necessario, e nao é toda mensagem que voce ri`;

        let chats = [];
        let inMemoryChats = [];
        let currentChatId = null;
        let isDeepSearchActive = false;
        let isThoughtsVisible = true;
        let timerInterval = null;
        let secondsElapsed = 0;

        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const newChatBtn = document.getElementById('new-chat-btn');
        const chatList = document.getElementById('chat-list');
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const sendBtn = document.getElementById('send-btn');
        const loadingIndicator = document.getElementById('loading-indicator');
        const deepSearchToggle = document.getElementById('deep-search-toggle');
        const thoughtsToggle = document.getElementById('thoughts-toggle');
        const statusHint = document.getElementById('status-hint');
        const thoughtsStreamWrap = document.getElementById('thoughts-stream-wrap');
        const thoughtsStream = document.getElementById('thoughts-stream');

        function init() {
            loadChats();
            if (!chats || chats.length === 0) createNewChat();
            else switchChat(chats[0].id);
            setupEventListeners();
        }

        function loadChats() {
            try {
                const saved = localStorage.getItem('labbrain_chats');
                if (saved) chats = JSON.parse(saved);
                else chats = inMemoryChats;
            } catch (e) { 
                chats = inMemoryChats; 
            }
        }

        function saveChats() {
            try { 
                localStorage.setItem('labbrain_chats', JSON.stringify(chats)); 
            } catch (e) {
                inMemoryChats = chats;
            }
            renderChatList();
        }

        function createNewChat() {
            const newChat = { id: Date.now().toString(), title: 'Nova Sessão ' + new Date().toLocaleTimeString(), messages: [] };
            chats.unshift(newChat);
            saveChats();
            switchChat(newChat.id);
            if (window.innerWidth < 768 && sidebar) sidebar.classList.add('closed');
        }

        function switchChat(id) {
            currentChatId = id;
            renderChatList();
            renderMessages();
            if (window.innerWidth < 768 && sidebar) sidebar.classList.add('closed');
        }

        function deleteChat(id, event) {
            event.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) createNewChat();
            else if (currentChatId === id) switchChat(chats[0].id);
            else saveChats();
        }

        function renderChatList() {
            if (!chatList) return;
            chatList.innerHTML = '';
            chats.forEach(chat => {
                const li = document.createElement('li');
                li.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                li.innerHTML = `<span class="chat-title">${chat.title}</span><button class="delete-chat">×</button>`;
                li.onclick = () => switchChat(chat.id);
                li.querySelector('.delete-chat').onclick = (e) => deleteChat(chat.id, e);
                chatList.appendChild(li);
            });
        }

        function renderMessages() {
            if (!chatContainer) return;
            const messages = chatContainer.querySelectorAll('.message');
            messages.forEach(m => m.remove());
            const chat = chats.find(c => c.id === currentChatId);
            if (chat && chat.messages) {
                chat.messages.forEach(msg => appendMessageDOM(msg.role, msg.content, msg.thoughts || null));
            }
            scrollToBottom();
        }

        function formatMessageContent(content) {
            if (!content) return "";
            
            // Renderiza Markdown simples (links, bold, blocos de código)
            let formatted = content
                .replace(/\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g, '<a class="source-link" href="$2" target="_blank" rel="noopener">$1</a>')
                .replace(/```([a-zA-Z]*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    const escapedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    return `
                        <div class="code-container">
                            <div class="code-toolbar">
                                <span class="code-lang">${lang || 'código'}</span>
                                <button class="copy-code-btn" onclick="copyToClipboard(this)">COPIAR</button>
                            </div>
                            <pre><code>${escapedCode}</code></pre>
                        </div>
                    `;
                });

            return formatted;
        }
    
        window.copyToClipboard = function(button) {
            const container = button.closest('.code-container');
            const textToCopy = container.querySelector('code').innerText;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalText = button.innerText;
                    button.innerText = 'COPIADO!';
                    setTimeout(() => button.innerText = originalText, 2000);
                });
            }
        };

        function appendMessageDOM(role, content, thoughts) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            const label = document.createElement('div');
            label.className = role === 'bot' ? 'bot-label' : 'user-label';
            label.innerText = role === 'bot' ? 'LabBrain (Gemini Search)' : 'Usuário';
            div.innerHTML = formatMessageContent(content);
            div.prepend(label);

            if (role === 'bot' && thoughts && thoughts.length > 0) {
                const details = document.createElement('details');
                details.className = 'thoughts-details';
                details.open = true;
                const summary = document.createElement('summary');
                summary.innerText = `🧠 PENSAMENTOS DA IA & LOG DE NAVEGAÇÃO VÍDEO/WEB (${thoughts.length} PASSOS)`;
                details.appendChild(summary);
                const contentDiv = document.createElement('div');
                contentDiv.className = 'thoughts-content';
                thoughts.forEach(t => {
                    const line = document.createElement('div');
                    line.className = 'thought-line';
                    line.innerText = t;
                    contentDiv.appendChild(line);
                });
                details.appendChild(contentDiv);
                div.appendChild(details);
            }

            chatContainer.insertBefore(div, loadingIndicator);
            scrollToBottom();
        }

        function scrollToBottom() { 
            if (chatContainer) chatContainer.scrollTop = chatContainer.scrollHeight; 
        }

        let currentThoughtsLog = [];

        function resetThoughtsStream() {
            currentThoughtsLog = [];
            if (thoughtsStream) thoughtsStream.innerHTML = '';
        }

        function pushThought(text) {
            currentThoughtsLog.push(text);
            if (isThoughtsVisible && thoughtsStream) {
                const line = document.createElement('div');
                line.className = 'thought-line';
                line.innerText = text;
                thoughtsStream.appendChild(line);
                thoughtsStream.scrollTop = thoughtsStream.scrollHeight;
            }
        }

        async function callModel(messages, maxTokens) {
            const safeOrigin = (window.location && window.location.origin && window.location.origin !== "null") 
                ? window.location.origin 
                : "https://labbrain.console";

            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                    'HTTP-Referer': safeOrigin,
                    'X-Title': 'LabBrain Console',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: MODEL_ID,
                    messages: messages,
                    max_tokens: maxTokens || 400
                })
            });
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(`Status ${response.status}: ${errData.error?.message || 'Erro no cluster'}`);
            }
            const data = await response.json();
            return data.choices[0].message.content.trim();
        }

        async function fetchViaProxies(targetUrl) {
            const proxyAttempts = [
                { name: 'corsproxy.io', build: u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`, parseJson: false },
                { name: 'allorigins(raw)', build: u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`, parseJson: false },
                { name: 'allorigins(get)', build: u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`, parseJson: true }
            ];

            for (const proxy of proxyAttempts) {
                try {
                    const resp = await fetch(proxy.build(targetUrl));
                    if (!resp.ok) continue;
                    if (proxy.parseJson) {
                        const json = await resp.json();
                        if (json && json.contents) return { html: json.contents, proxy: proxy.name };
                    } else {
                        const html = await resp.text();
                        if (html && html.length > 200) return { html, proxy: proxy.name };
                    }
                } catch (err) {
                    continue;
                }
            }
            return null;
        }

        // RETORNA ID DO YOUTUBE CASO O LINK SEJA UM VÍDEO
        function getYouTubeVideoId(url) {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // EXTRAI TRANSCRIÇÃO / LEGENDAS DE VÍDEO DO YOUTUBE
        async function fetchYouTubeTranscript(videoId) {
            pushThought(`📹 Extraindo rastros de áudio e legendas do YouTube (ID: ${videoId})...`);
            const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
            const fetched = await fetchViaProxies(videoUrl);
            if (!fetched || !fetched.html) return null;

            // Busca captionTracks no código fonte do YouTube
            const match = fetched.html.match(/captionTracks":\s*(\[.*?\])/);
            if (!match) {
                pushThought(`⚠️ Nenhuma legenda/transcrição oficial ou automática encontrada no vídeo.`);
                return null;
            }

            try {
                const captionTracks = JSON.parse(match[1]);
                if (!captionTracks || captionTracks.length === 0) return null;

                // Prioriza português (pt) ou pega a primeira disponível
                let track = captionTracks.find(t => t.languageCode === 'pt' || t.languageCode === 'pt-BR') || captionTracks[0];
                pushThought(`🎙️ Legenda encontrada no idioma: [${track.languageCode}]. Baixando áudio convertido em texto...`);

                const captionFetched = await fetchViaProxies(track.baseUrl);
                if (!captionFetched || !captionFetched.html) return null;

                // Converte o XML timedtext em linhas temporizadas
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(captionFetched.html, "text/xml");
                const textNodes = xmlDoc.getElementsByTagName("text");

                let transcriptLines = [];
                for (let i = 0; i < textNodes.length; i++) {
                    let node = textNodes[i];
                    let start = parseFloat(node.getAttribute("start") || "0");
                    let text = node.textContent.replace(/&#39;/g, "'").replace(/&quot;/g, '"').trim();
                    let min = Math.floor(start / 60);
                    let sec = Math.floor(start % 60).toString().padStart(2, '0');
                    if (text) transcriptLines.push(`[${min}:${sec}] ${text}`);
                }

                return transcriptLines.join("\n").substring(0, 5000); // Até 5000 chars de transcrição
            } catch (e) {
                pushThought(`⚠️ Falha no parser da transcrição XML.`);
                return null;
            }
        }

        // RETORNA DOMÍNIOS PRIORITÁRIOS BASEADOS NO ASSUNTO
        function getPriorityDomains(query) {
            const q = query.toLowerCase();
            const domains = [];
            if (q.includes('youtuber') || q.includes('inscrito') || q.includes('canal') || q.includes('youtube') || q.includes('video') || q.includes('fala')) {
                domains.push('youtube.com', 'socialblade.com', 'wikitubia.fandom.com');
            }
            if (q.includes('roblox') || q.includes('luau') || q.includes('script')) {
                domains.push('roblox.com', 'devforum.roblox.com');
            }
            return domains;
        }

        function sortResultsByPriority(results, priorityDomains) {
            if (!priorityDomains || priorityDomains.length === 0) return results;
            return [...results].sort((a, b) => {
                const urlA = (a.targetUrl || a.link).toLowerCase();
                const urlB = (b.targetUrl || b.link).toLowerCase();
                const aPriority = priorityDomains.some(d => urlA.includes(d)) ? 1 : 0;
                const bPriority = priorityDomains.some(d => urlB.includes(d)) ? 1 : 0;
                return bPriority - aPriority;
            });
        }

        // BUSCA NO DUCKDUCKGO
        async function searchQuery(query) {
            const searchUrl = `https://html.duckduckgo.com/html/?q=${encodeURIComponent(query)}`;
            const result = await fetchViaProxies(searchUrl);
            if (!result) return { results: [], proxy: null };

            const parser = new DOMParser();
            const doc = parser.parseFromString(result.html, 'text/html');
            const snippets = doc.querySelectorAll('.result__snippet');
            const links = doc.querySelectorAll('.result__url');
            const anchorLinks = doc.querySelectorAll('.result__title a');

            const results = [];
            snippets.forEach((el, index) => {
                const snippet = el.textContent.trim();
                const displayUrl = links[index] ? links[index].textContent.trim() : '';
                let rawTarget = anchorLinks[index] ? anchorLinks[index].getAttribute('href') : '';
                
                if (rawTarget.includes('uddg=')) {
                    const match = rawTarget.match(/uddg=([^&]+)/);
                    if (match) rawTarget = decodeURIComponent(match[1]);
                }

                if (snippet) results.push({ snippet, link: displayUrl, targetUrl: rawTarget });
            });
            return { results, proxy: result.proxy };
        }

        // SCRAPING / INSPEÇÃO DE TEXTO DO DOM
        async function extractWebsiteContent(url) {
            if (!url || !url.startsWith('http')) return null;

            // Se for vídeo do YouTube, ativa extrator de transcrição
            const videoId = getYouTubeVideoId(url);
            if (videoId) {
                const transcript = await fetchYouTubeTranscript(videoId);
                if (transcript) {
                    return { pageText: transcript, isVideo: true, videoId };
                }
            }

            const fetched = await fetchViaProxies(url);
            if (!fetched || !fetched.html) return null;

            const parser = new DOMParser();
            const doc = parser.parseFromString(fetched.html, 'text/html');
            
            doc.querySelectorAll('script, style, noscript, nav, header, footer, iframe, svg').forEach(el => el.remove());
            
            const paragraphs = Array.from(doc.querySelectorAll('p, article, h1, h2, h3, span'))
                .map(p => p.textContent.trim())
                .filter(txt => txt.length > 25);

            const pageText = paragraphs.join('\n').substring(0, 3500); 
            return { pageText, charLength: pageText.length, isVideo: false };
        }

        // DECOMPOSITOR DE PERGUNTAS
        async function decomposeQuery(prompt) {
            pushThought(`🔀 Decompondo pergunta no estilo Gemini Search...`);
            const promptDecompose = `Decomponha a pergunta "${prompt}" em sub-buscas diretas para o Google/DuckDuckGo.
Responda EXCLUSIVAMENTE em formato JSON (Array de strings): ["busca 1", "busca 2"]`;

            try {
                const res = await callModel([
                    { role: 'system', content: 'Responda estritamente com JSON no formato ["item1", "item2"].' },
                    { role: 'user', content: promptDecompose }
                ], 200);

                const clean = res.replace(/```json|```/g, '').trim();
                const subQueries = JSON.parse(clean);

                if (Array.isArray(subQueries) && subQueries.length > 0) {
                    pushThought(`🎯 Sub-consultas isoladas: ${subQueries.map(q => `"${q}"`).join(', ')}`);
                    return subQueries;
                }
            } catch (e) {
                pushThought(`ℹ️ Mantendo busca unificada.`);
            }
            return [prompt];
        }

        // MOTOR RECURSIVO + DIARIZAÇÃO DE FALA EM VÍDEOS
        async function executeRecursiveDeepSearch(originalQuery) {
            const subQueries = await decomposeQuery(originalQuery);
            let keyFindings = [];
            let citedSources = [];

            for (let subIdx = 0; subIdx < subQueries.length; subIdx++) {
                const subQuery = subQueries[subIdx];
                pushThought(`\n📌 [GEMINI SEARCH ${subIdx + 1}/${subQueries.length}]: "${subQuery}"`);

                const priorityDomains = getPriorityDomains(subQuery);
                let subQuerySolved = false;
                let round = 0;
                let currentQuery = subQuery;

                while (!subQuerySolved && round < 2) {
                    round++;
                    pushThought(`🔍 Varrendo a web por: "${currentQuery}"...`);

                    const { results } = await searchQuery(currentQuery);

                    if (!results || results.length === 0) {
                        currentQuery = `${subQuery} dados`;
                        continue;
                    }

                    const sortedResults = sortResultsByPriority(results, priorityDomains);

                    for (let i = 0; i < Math.min(sortedResults.length, 3); i++) {
                        const target = sortedResults[i];
                        const targetUrl = target.targetUrl || target.link;

                        pushThought(`🎯 Inspecionando fonte: "${targetUrl}"`);

                        const scraped = await extractWebsiteContent(targetUrl);

                        let contentToAnalyze = "";
                        let promptSpecialInstruction = "";

                        if (scraped && scraped.isVideo) {
                            pushThought(`🎬 [Processando Vídeo]: Transcrição e tempo carregados. Executando Diarização de Locutores...`);
                            contentToAnalyze = scraped.pageText;
                            promptSpecialInstruction = `Este conteúdo é a TRANSCRIÇÃO DE UM VÍDEO COM TIMESTAMPS. DEDUZA QUEM SÃO OS LOCUTORES/FALANTES com base no contexto do diálogo e diga quem falou o quê.`;
                        } else if (scraped && scraped.pageText) {
                            pushThought(`✅ Página web lida com sucesso (${scraped.charLength} caracteres).`);
                            contentToAnalyze = scraped.pageText;
                            promptSpecialInstruction = `Extraia os fatos reais da página web.`;
                        } else {
                            contentToAnalyze = target.snippet;
                            promptSpecialInstruction = `Extraia os fatos do resumo.`;
                        }

                        const analysisPrompt = `Dúvida do Usuário: "${subQuery}"
${promptSpecialInstruction}

Conteúdo Extraído (${targetUrl}):
"${contentToAnalyze}"

Responda EXCLUSIVAMENTE em JSON no seguinte formato:
{
  "raciocinio": "O que você deduziu ou leu neste conteúdo (incluindo locutores se for vídeo)",
  "fato_relevante": "Resumo completo do fato com nomes/locutores e números exatos",
  "encontrou_resposta": true ou false
}`;

                        try {
                            const raw = await callModel([
                                { role: 'system', content: 'Responda estritamente com JSON válido.' },
                                { role: 'user', content: analysisPrompt }
                            ], 400);

                            const clean = raw.replace(/```json|```/g, '').trim();
                            const parsed = JSON.parse(clean);

                            if (parsed.raciocinio) {
                                pushThought(`🤔 ${parsed.raciocinio}`);
                            }

                            if (parsed.encontrou_resposta && parsed.fato_relevante) {
                                keyFindings.push(`- **Dados de [${subQuery}]**: ${parsed.fato_relevante} (Fonte: [Acessar Link](${targetUrl}))`);
                                citedSources.push({ url: targetUrl, snippet: target.snippet });
                                pushThought(`💾 [MEMÓRIA SALVA]: ${parsed.fato_relevante}`);
                                subQuerySolved = true;
                                break;
                            }
                        } catch (err) {
                            if (target.snippet) keyFindings.push(`- ${target.snippet} (Fonte: [Link](${targetUrl}))`);
                        }
                    }

                    if (!subQuerySolved) {
                        currentQuery = `${subQuery} resposta direta`;
                    }
                }
            }

            return { keyFindings, citedSources };
        }

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            chat.messages.push({ role: 'user', content: text });
            appendMessageDOM('user', text);
            promptInput.value = '';
            
            if (chat.messages.length === 1) {
                chat.title = text.substring(0, 25) + (text.length > 25 ? '...' : '');
            }
            saveChats();

            resetThoughtsStream();
            secondsElapsed = 0;
            loadingIndicator.style.display = 'block';

            if (isDeepSearchActive && isThoughtsVisible) {
                thoughtsStreamWrap.classList.add('visible');
            }

            loadingIndicator.innerText = isDeepSearchActive 
                ? `[GEMINI SEARCH] Varrendo web & transcrevendo vídeos... [00:00]`
                : `PROCESSANDO SINAL... [00:00]`;

            timerInterval = setInterval(() => {
                secondsElapsed++;
                let mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                let secs = (secondsElapsed % 60).toString().padStart(2, '0');
                loadingIndicator.innerText = isDeepSearchActive 
                    ? `[GEMINI SEARCH] Analisando áudios, transcrições e sites... [${mins}:${secs}]`
                    : `PROCESSANDO SINAL... [${mins}:${secs}]`;
            }, 1000);

            scrollToBottom();

            let enrichedPrompt = text;

            if (isDeepSearchActive) {
                pushThought(`🎯 Recebido comando: "${text}". Iniciando Gemini Search Engine...`);
                const { keyFindings, citedSources } = await executeRecursiveDeepSearch(text);

                if (keyFindings.length > 0) {
                    enrichedPrompt = `SISTEMA DE GROUNDING ESTILO GEMINI SEARCH:
Abaixo estão os dados minerados diretamente da internet e de transcrições de vídeo:

${keyFindings.join('\n\n')}

[PERGUNTA DO USUÁRIO]:
"${text}"

FORMATO DA RESPOSTA REQUISITADO:
1. Forneça uma resposta direta, clara e formatada no estilo do Gemini.
2. Se houver vídeos analisados, explique quem estava falando o quê (diarização de locutores) com os timestamps.
3. Coloque uma seção final chamada "**Fontes Consultadas:**" listando os links originais pesquisados.`;
                    pushThought(`📦 Dados e transcrições de vídeo consolidados. Gerando resposta sintetizada estilo Gemini...`);
                } else {
                    enrichedPrompt = text;
                    pushThought(`⚠️ Não foi possível extrair dados conclusivos da web ou vídeos. Respondendo com conhecimento interno.`);
                }
            }

            statusHint.innerText = "CRAWLER MESH: SINTETIZANDO RESPOSTA";

            const apiMessages = [
                { role: 'system', content: SYSTEM_PROMPT },
                ...chat.messages.slice(0, -1).map(m => ({ role: m.role === 'bot' ? 'assistant' : 'user', content: m.content })),
                { role: 'user', content: enrichedPrompt }
            ];

            try {
                const botReply = await callModel(apiMessages, 3072);

                const thoughtsForMsg = isDeepSearchActive ? [...currentThoughtsLog] : null;
                chat.messages.push({ role: 'bot', content: botReply, thoughts: thoughtsForMsg });
                appendMessageDOM('bot', botReply, thoughtsForMsg);
                saveChats();

            } catch (error) {
                appendMessageDOM('bot', `[ERRO DO SISTEMA]\nFalha na operação: ${error.message}`, isDeepSearchActive ? [...currentThoughtsLog] : null);
            } finally {
                clearInterval(timerInterval);
                loadingIndicator.style.display = 'none';
                thoughtsStreamWrap.classList.remove('visible');
                statusHint.innerText = "CRAWLER MESH: STANDBY";
            }
        }

        function setupEventListeners() {
            if (toggleSidebarBtn) toggleSidebarBtn.onclick = () => sidebar.classList.toggle('closed');
            if (newChatBtn) newChatBtn.onclick = createNewChat;
            if (sendBtn) sendBtn.onclick = sendMessage;

            deepSearchToggle.onclick = () => {
                isDeepSearchActive = !isDeepSearchActive;
                if (isDeepSearchActive) {
                    deepSearchToggle.classList.add('active');
                    deepSearchToggle.innerText = "DEEP SEARCH: ON";
                } else {
                    deepSearchToggle.classList.remove('active');
                    deepSearchToggle.innerText = "DEEP SEARCH: OFF";
                }
            };

            thoughtsToggle.onclick = () => {
                isThoughtsVisible = !isThoughtsVisible;
                if (isThoughtsVisible) {
                    thoughtsToggle.classList.add('active');
                    thoughtsToggle.innerText = "PENSAMENTOS: ON";
                } else {
                    thoughtsToggle.classList.remove('active');
                    thoughtsToggle.innerText = "PENSAMENTOS: OFF";
                    thoughtsStreamWrap.classList.remove('visible');
                }
            };

            if (promptInput) {
                promptInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                });
            }
        }

        init();
    </script>
